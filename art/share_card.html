<!DOCTYPE html>
<!--
  The link-preview card (public/nolle-studios-share.jpg), composed in code from
  the site's own materials: the Blender cork, pins, tape, glass rim and glass
  mark, with prints from published shoots. See art/README.md to render it.
  Swap a print with ?p1=<photo id>&p2=… (ids from /api/site).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nolle Studios share card</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url(/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }

html, body { margin: 0; background: #0A0A0C; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; }
.card > div, .card > figure { position: absolute; }
.card > figure { margin: 0; }

/* The table: the same cork, tone and light as the site's board. */
.cork { inset: 0; background: #C08046 url(/src/assets/cork-tile.webp) repeat; background-size: 640px 640px; }
.cork-soft { inset: -20px; background: url(/src/assets/cork-tile.webp) repeat; background-size: 824px 824px; opacity: .4; mix-blend-mode: soft-light; }
.tone { inset: 0; background: #C8813F; mix-blend-mode: multiply; opacity: .24; }
.light { inset: 0; z-index: 8; pointer-events: none;
  background: radial-gradient(52% 54% at 50% 50%, rgba(255,238,206,.2), transparent 70%), radial-gradient(120% 100% at 50% 50%, transparent 42%, rgba(34,16,3,.7) 100%); }

/* Prints, hung like the board's: no border, a sheen, a soft cast shadow. */
.print { z-index: 2; transform-origin: 50% 0; }
.print img.photo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.print::before { content: ""; position: absolute; left: 6px; right: 6px; bottom: -10px; height: 18px; z-index: -1; border-radius: 50%; background: rgba(38,17,2,.45); filter: blur(8px); }
.print::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(118deg, rgba(255,255,255,.1) 0 13%, transparent 28%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 6px 11px 22px rgba(40,19,3,.45), 1px 2px 4px rgba(40,19,3,.4); }
.hold { position: absolute; z-index: 3; height: auto; transform: translate(-50%,-50%); }

/* The plaque: the site's liquid glass at its clearest, with the Blender rim. */
.plaque {
  left: 50%; top: 50%; z-index: 6; width: 720px; height: 236px; margin: -118px 0 0 -360px; border-radius: 40px; overflow: hidden; isolation: isolate;
  display: grid; grid-template-columns: auto auto; align-content: center; justify-content: center; align-items: center; column-gap: 30px;
  border: 1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(90% 160% at 8% -60%, rgba(255,255,255,.3), transparent 50%),
    radial-gradient(60% 120% at 96% 150%, rgba(255,236,210,.14), transparent 55%),
    linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,0) 42%, rgba(255,255,255,0) 70%, rgba(255,255,255,.06)),
    rgba(24,15,8,.46);
  backdrop-filter: blur(22px) saturate(170%) brightness(1.02);
  box-shadow: inset 0 -16px 30px -22px rgba(255,255,255,.14), 0 30px 60px rgba(30,14,4,.42), 0 6px 14px rgba(30,14,4,.26);
}
.plaque::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: linear-gradient(162deg, rgba(255,255,255,.66), rgba(255,255,255,.16) 18%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 64%, rgba(255,232,204,.14) 84%, rgba(255,232,204,.36));
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.plaque::after { content: ""; position: absolute; inset: -1px; z-index: 0; pointer-events: none; border-radius: inherit;
  border: 66px solid transparent; border-image: url(/src/assets/glass/liquid-glass.webp) 160 fill / 66px / 0 stretch; opacity: .6; filter: saturate(.8) brightness(.94); }
.plaque > * { position: relative; z-index: 2; }
.plaque__mark { width: 112px; height: 112px; filter: drop-shadow(0 8px 14px rgba(20,10,2,.5)); }
.plaque__words { display: grid; gap: 16px; }
.plaque__name { font: 400 104px/.86 "Instrument Serif", serif; letter-spacing: -.012em; color: #FBF8F3; text-shadow: 0 2px 18px rgba(0,0,0,.4); white-space: nowrap; }
.plaque__line { display: flex; align-items: center; gap: 14px; font: 500 17px/1 "JetBrains Mono", monospace; letter-spacing: .22em; color: rgba(255,250,244,.9); text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.plaque__line i { width: 5px; height: 5px; border-radius: 50%; background: #E8BF94; box-shadow: 0 0 10px rgba(232,191,148,.9); }
.glint { left: 50%; top: 50%; z-index: 7; width: 360px; height: 1px; margin: 117px 0 0 -180px; background: linear-gradient(90deg, transparent, rgba(255,222,184,.38), transparent); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="cork"></div><div class="cork-soft"></div><div class="tone"></div>

  <figure class="print" data-photo="p1" style="left:-34px; top:58px; width:300px; height:200px; transform:rotate(-4.5deg)">
    <img class="hold" src="/src/assets/tape/tape-strip-1.webp" style="left:50%; top:0; width:150px; transform:translate(-50%,-50%) rotate(-3deg)" alt="">
  </figure>
  <figure class="print" data-photo="p2" style="left:84px; top:330px; width:212px; height:318px; transform:rotate(3.2deg)">
    <img class="hold" src="/src/assets/pins/pin-red-1.webp" style="left:50%; top:16px; width:58px" alt="">
  </figure>
  <figure class="print" data-photo="p3" style="left:376px; top:-58px; width:300px; height:200px; transform:rotate(1.6deg)">
    <img class="hold" src="/src/assets/pins/pin-yellow-2.webp" style="left:16px; top:calc(100% - 16px); width:52px" alt="">
    <img class="hold" src="/src/assets/pins/pin-yellow-1.webp" style="left:calc(100% - 16px); top:calc(100% - 16px); width:52px" alt="">
  </figure>
  <figure class="print" data-photo="p4" style="left:930px; top:-26px; width:312px; height:208px; transform:rotate(3.4deg)">
    <img class="hold" src="/src/assets/pins/pin-blue-2.webp" style="left:16px; top:calc(100% - 16px); width:56px" alt="">
  </figure>
  <figure class="print" data-photo="p5" style="left:880px; top:368px; width:300px; height:200px; transform:rotate(-3deg)">
    <img class="hold" src="/src/assets/tape/tape-corner-1.webp" style="left:2%; top:2%; width:78px; transform:translate(-50%,-50%) rotate(-44deg)" alt="">
    <img class="hold" src="/src/assets/tape/tape-corner-2.webp" style="left:98%; top:2%; width:78px; transform:translate(-50%,-50%) rotate(47deg)" alt="">
  </figure>
  <figure class="print" data-photo="p6" style="left:452px; top:470px; width:260px; height:174px; transform:rotate(-1.4deg)">
    <img class="hold" src="/src/assets/pins/pin-green-1.webp" style="left:16px; top:16px; width:52px" alt="">
    <img class="hold" src="/src/assets/pins/pin-green-2.webp" style="left:calc(100% - 16px); top:16px; width:52px" alt="">
  </figure>

  <div class="plaque">
    <img class="plaque__mark" src="/src/assets/glass/mark.webp" alt="">
    <div class="plaque__words">
      <div class="plaque__name">Nolle Studios</div>
      <div class="plaque__line">PHOTOGRAPHY <i></i> NOLLESTUDIOS.COM</div>
    </div>
  </div>
  <div class="glint"></div>
  <div class="light"></div>
</div>
<script type="module">
// Published photographs from four shoots; any can be swapped from the query.
const photos = {
  p1: "bc1acf6b-e3c7-4e87-8340-a28089958330", // string light, First Photos
  p2: "4072c47c-bdb6-40e4-9689-8dae289f5f21", // on deck, Kyle Baseball Shoot
  p3: "cbca9594-0f1f-42c6-852f-09c768bbf92c", // chrysanthemums, First Photos
  p4: "4ba6c703-c495-4f19-b903-784cf42d798e", // suit, Jack Nolle Shoot
  p5: "7a2c5bc5-f99d-4539-a154-64080e19bd2a", // the swing, Kyle Baseball Shoot
  p6: "da720bd9-6c58-4f07-980e-f01242827ce5", // maltipoo, First Photos
};
const query = new URLSearchParams(location.search);
await Promise.all([...document.querySelectorAll("[data-photo]")].map(print => new Promise(resolve => {
  const img = new Image();
  img.className = "photo";
  img.alt = "";
  img.onload = img.onerror = resolve;
  img.src = `/media/photos/${query.get(print.dataset.photo) || photos[print.dataset.photo]}/1600.jpg`;
  print.prepend(img);
})));
await document.fonts.ready;
document.body.dataset.ready = "1";
</script>
</body>
</html>
