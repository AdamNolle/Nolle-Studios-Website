services:
  cms:
    environment:
      SITE_URL: ${SITE_URL:-https://nollestudios.com/}
      ALT_TEXT_URL: ${ALT_TEXT_URL:-http://ollama:11434}
      ALT_TEXT_MODEL: ${ALT_TEXT_MODEL:-qwen3-vl:8b-instruct}
      ALT_TEXT_AUTO: ${ALT_TEXT_AUTO:-true}
    networks:
      - default
      - local_ai

  web:
    # The public edge is a Cloudflare Tunnel. Keep the origin private and use
    # plain HTTP for the final, host-local hop from cloudflared to Caddy.
    environment:
      SITE_DOMAIN: :80
    ports: !override
      - "127.0.0.1:${TUNNEL_ORIGIN_PORT:-18081}:80"
    volumes:
      - ./infra/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro

networks:
  local_ai:
    name: ${ALT_TEXT_NETWORK:-nollehome_default}
    external: true
